<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: Arial, sans-serif; background: #f0f4f8;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: white; width: 90%; max-width: 350px; padding: 30px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #2563eb; margin-bottom: 25px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input {
            width: 100%; padding: 12px; margin-bottom: 18px;
            border: 1px solid #ccc; border-radius: 6px; font-size: 15px;
        }
        button {
            width: 100%; padding: 12px; background: #2563eb; color: white;
            border: none; border-radius: 6px; font-size: 16px; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .show-password {
            display: flex; align-items: center; gap: 8px;
            margin-top: -8px; margin-bottom: 18px; font-size: 14px;
        }
        .show-password input { width: auto; margin: 0; }
        .footer { text-align: center; margin-top: 20px; font-size: 13px; color: #666; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <form onsubmit="login(event)">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" required>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
            <div class="show-password">
                <input type="checkbox" id="showPassword" onchange="togglePassword()">
                <label for="showPassword">Show Password</label>
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="footer">© 2026 My Website</div>
    </div>
    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            password.type = password.type === "password" ? "text" : "password";
        }
        function login(event) {
            event.preventDefault();
            const username = document.getElementById("username").value;
            alert("Login form submitted for: " + username);
        }
    </script>
</body>
</html>
